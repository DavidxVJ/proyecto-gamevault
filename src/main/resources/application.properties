#Configuramos conexion en Spring Boot. Usuario, contraseña y BD son los mismos que en docker-compose.yml
#Ademas se usa variables de entorno ${VARIABLE:valorPorDefecto}. Spring Boot busca primero si existe una variable
#de entorno llamada DB_USERNAME en el sistema operativo. Si existe, la usa. Si no existe, usa el valor que
#pusimos después de los dos puntos como respaldo.
spring.datasource.url=jdbc:postgresql://localhost:5432/gamevault
spring.datasource.username=${DB_USERNAME:gamevault_user}
spring.datasource.password=${DB_PASSWORD:gamevault_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Clave de al menos 64 caracteres para HS256 algoritmo. Es una clave con la que vamos a firmar digitalmente cada token:
#cualquier persona con esta clave podría falsificar tokens válidos, así que en un proyecto real esto nunca debería
#estar en texto plano en un archivo versionado en Git.
app.jwt.secret=${JWT_SECRET:C0stc0123!K0zm0z0510!h8bco52020Texto_solo_para_aumentar_el_numero_de_caracteres}
#86400000 son 24h en milisegundos.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


