#Es un application.properties diferente debido a que cuando Spring ejecuta tests, busca
#automáticamente application.properties dentro de src/test/resources antes que el de src/main/resources
#De esta manera, los tests nunca tocan la BD real de Postgres ni dependen de que Docker esté corriendo.

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#ddl-auto=create-drop significa "crea las tablas al iniciar el test, bórralas al terminar"
spring.jpa.hibernate.ddl-auto=create-drop 
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.jwt.secret=claveDePruebaSoloParaTestsDebeSerLoSuficientementeLargaParaHS256
app.jwt.expiration-ms=3600000